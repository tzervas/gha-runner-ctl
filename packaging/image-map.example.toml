# Example label → OCI image map for gha-runner-ctl (issue #28).
# Install on the fleet host and point GHA_IMAGE_MAP at this file.
# Built-in defaults already cover common distros; this file overrides/extends.
#
# Workflow:
#   runs-on: [self-hosted, linux, x64, podman, ubuntu-24.04]
# spawns a runner whose rootfs is the mapped image (no nested podman/docker).

[images]
ubuntu-24.04 = "docker.io/library/ubuntu:24.04"
ubuntu-22.04 = "docker.io/library/ubuntu:22.04"
debian-bookworm = "docker.io/library/debian:bookworm"
rocky-9 = "docker.io/library/rockylinux:9"
# custom-ci = "ghcr.io/example/ci-base:2026.07"

# Runner-class labels (job label schema `[..., podman, <size>, <class>]`).
# Built by packaging/Containerfile.runner-<class>; see docs/WORK_IMAGES.md.
# Published by .github/workflows/publish-images.yml (no application secrets — see that
# file's header) to ghcr.io/tzervas/fleet-runner-<class>:<semver>. Keep <semver> in sync
# with whatever the publish workflow last actually pushed (security train: 0.1.2).
base = "ghcr.io/tzervas/fleet-runner-base:0.1.2"
shell = "ghcr.io/tzervas/fleet-runner-shell:0.1.2"
python = "ghcr.io/tzervas/fleet-runner-python:0.1.2"
rust = "ghcr.io/tzervas/fleet-runner-rust:0.1.2"
docs = "ghcr.io/tzervas/fleet-runner-docs:0.1.2"
gpu = "ghcr.io/tzervas/fleet-runner-gpu:0.1.2"
# Per-repo dependency WARM images (packaging/Containerfile.warm-python /
# Containerfile.warm-rust) are NOT fleet-wide class labels — they are content-addressed
# per-repo, per-lock-hash tags (fleet-warm-python:<repo>-<lock-hash>), so they do not get a
# fixed entry in this map. See docs/WORK_IMAGES.md for how a consuming repo computes and
# selects its own warm tag via GHA_IMAGE.

[arches]
# Optional platform overrides (defaults are built-in for known arch labels).
arm64 = "linux/arm64"
riscv64 = "linux/riscv64"
