# FLEET POLICY (owner, 2026-08-01): ALL GitHub Actions run on self-hosted runners.
# No GitHub-hosted (cloud) runners, ever. If the fleet is fully down, the unblock is to
# spawn a single container and register it as a one-off runner — not to fall back to cloud.
# Consequence, accepted deliberately: while the fleet is unhealthy, gate/aggregator jobs
# cannot run either, so PRs sit pending rather than failing loudly.
# One release path. One button. Idempotent at every step.
#
# WHY THIS REPLACES TWO WORKFLOWS
#   release.yml and release-on-merge.yml BOTH ran `gh release create/upload` — two workflows
#   racing to create the same release, with only one of them also tagging and publishing.
#   Which one won depended on timing. That is not a release process, it is a coin flip.
#
# WHY DISPATCH RATHER THAN ON-PUSH
#   A release should be a decision, not a side effect of a merge. Dispatch gives three entry
#   points for free — the Actions UI button, `gh workflow run` (a single API call), and any
#   MCP tool that wraps that same call — without a separate mechanism for each.
#
# IDEMPOTENCY IS THE CONTRACT
#   Every mutating step is check-then-act, so a re-run after a partial failure resumes rather
#   than duplicating or erroring. This matters because the previous release path died at the
#   tag step AFTER the build succeeded, leaving no way to continue without redoing everything.
#
# GITHUB-HOSTED ON PURPOSE
#   This must not depend on the self-hosted fleet. Shipping a fix for runner OOM behaviour
#   cannot require those runners to be healthy — that is circular, and it fails precisely when
#   you most need to ship.

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump. `none` releases the version already in Cargo.toml."
        type: choice
        options: [none, patch, minor, major]
        default: none
      dry_run:
        description: "Resolve and report every action without mutating anything."
        type: boolean
        default: true
      publish_crate:
        description: "Publish to crates.io (skipped automatically if already published)."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never two releases at once. Do NOT cancel in progress — a half-cancelled release is the
  # exact partial state this workflow exists to avoid.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Self-hosted work images historically lack `gh` (ubuntu-latest had it preinstalled).
      # Prefer baking into ap-fleet-work-images (scribe-cpu-build / gha-work); this step is the
      # interim so release can re-run before workers recycle the new image layers.
      - name: Ensure gh CLI
        env:
          GH_VERSION: "2.97.0"
          GH_SHA256: "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp
          install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_amd64"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version

      # ── resolve ────────────────────────────────────────────────────────────────────────
      - name: Resolve the version to release
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CUR=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "current=$CUR" >> "$GITHUB_OUTPUT"

          # Resolve the package name (crates.io identity) and every [[bin]] name
          # straight from Cargo.toml, once, here — every later step reads these
          # outputs instead of pasting the name again. This is the fix for the
          # class of bug #114 shipped: the crates.io preflight, `cargo update -p`,
          # and the release archive all had the pre-rename name hardcoded, so
          # renaming the crate left three dangling references that nothing
          # caught. A literal can go stale; a value read from Cargo.toml cannot.
          PKG=$(awk '
            /^\[package\]/ { insec=1; next }
            /^\[/          { insec=0 }
            insec && /^name[[:space:]]*=/ { print; exit }
          ' Cargo.toml | sed -E 's/^name[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/')
          BINS=$(awk '
            /^\[\[bin\]\]/ { insec=1; next }
            /^\[/          { insec=0 }
            insec && /^name[[:space:]]*=/ { print; insec=0 }
          ' Cargo.toml | sed -E 's/^name[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/')
          PRIMARY_BIN=$(printf '%s\n' "$BINS" | head -n1)

          # Fail loud, not open: an empty name here would silently turn into
          # "crates.io/api/v1/crates//$VER" or "tar -czf ... -C target/release"
          # with no file argument — either reads as success on some code path.
          # Cargo.toml's shape changing is exactly the scenario this guards.
          [ -n "$PKG" ]         || { echo "::error::could not resolve [package].name from Cargo.toml"; exit 1; }
          [ -n "$PRIMARY_BIN" ] || { echo "::error::could not resolve any [[bin]].name from Cargo.toml"; exit 1; }

          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "primary_bin=$PRIMARY_BIN" >> "$GITHUB_OUTPUT"
          echo "bins=$(printf '%s' "$BINS" | tr '\n' ' ' | sed 's/[[:space:]]*$//')" >> "$GITHUB_OUTPUT"

          if [ "$BUMP" = "none" ]; then
            NEW="$CUR"
          else
            # NOTE ON 0.x SEMANTICS: at 0.y.z the MINOR is the breaking position, so a
            # non-breaking feature is a PATCH. cz's default bump_map disagrees (it maps
            # feat -> minor), which is why the bump is an explicit input here rather than
            # inferred from commit messages.
            IFS=. read -r MA MI PA <<< "$CUR"
            case "$BUMP" in
              patch) NEW="$MA.$MI.$((PA+1))" ;;
              minor) NEW="$MA.$((MI+1)).0" ;;
              major) NEW="$((MA+1)).0.0" ;;
            esac
          fi
          echo "new=$NEW"     >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"    >> "$GITHUB_OUTPUT"
          printf '### Release plan\n\n- package: `%s`\n- binaries: `%s`\n- current: `%s`\n- releasing: `%s`\n- tag: `v%s`\n- dry run: `%s`\n' \
            "$PKG" "$BINS" "$CUR" "$NEW" "$NEW" "${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"

      # ── preflight: report what already exists, so every later step can skip precisely ──
      - name: Preflight — what already exists
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.new }}
          PKG: ${{ steps.ver.outputs.pkg }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 \
            && T=yes || T=no
          gh release view "$TAG" >/dev/null 2>&1 && R=yes || R=no

          # crates.io: distinguish "already published" from "could not check". An
          # unreachable registry must NOT read as "not published" — that would attempt a
          # publish that then fails late, after tagging. $PKG comes from Cargo.toml
          # (resolved in the previous step), never a literal — a hardcoded name here is
          # exactly what made this check permanently read "not published" after #114
          # renamed the crate: the old name 404s forever regardless of real state.
          CODE=$(curl -s -o /tmp/cr.json -w '%{http_code}' \
                 -H 'User-Agent: gha-runner-ctl-release' \
                 "https://crates.io/api/v1/crates/$PKG/$VER" || echo 000)
          case "$CODE" in
            200) C=yes ;;
            404) C=no ;;
            *)   C=unknown ;;
          esac

          { echo "tag_exists=$T"; echo "release_exists=$R"; echo "crate_published=$C"; } >> "$GITHUB_OUTPUT"
          printf -- '- tag exists: `%s`\n- release exists: `%s`\n- crate published (`%s`): `%s`\n' \
            "$T" "$R" "$PKG" "$C" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to proceed on an unknown registry state
        if: steps.pre.outputs.crate_published == 'unknown' && inputs.publish_crate
        env:
          VER: ${{ steps.ver.outputs.new }}
          PKG: ${{ steps.ver.outputs.pkg }}
        run: |
          echo "::error::Could not determine whether $PKG $VER is on crates.io (registry unreachable or returned an unexpected status)."
          echo "Unknown is not the same as not-published. Refusing to tag before a publish that may fail."
          exit 1

      - name: Guard — main's ruleset would reject the version-bump push
        # release-dispatch's "Commit the version bump" step pushes straight to main.
        # If main requires PRs (this repo's ruleset does — see issue #99), that push
        # is rejected by GH013 *after* build+test+package already ran, wasting the
        # run. Ask the ruleset API directly (no admin scope needed) and fail before
        # any of that work starts. Unprotected mains, and bump=none (which never
        # pushes), are unaffected.
        if: ${{ !inputs.dry_run && inputs.bump != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RULES=$(gh api "repos/${{ github.repository }}/rules/branches/main")
          if printf '%s' "$RULES" | grep -q '"type":"pull_request"'; then
            echo "::error::main is protected by a ruleset requiring pull requests (see issue #99)."
            echo "::error::bump=${{ inputs.bump }} would push the version-bump commit directly to main and be rejected (GH013) after build+test+package already ran."
            echo "::error::Land the version bump through a normal PR instead, then re-dispatch this workflow with bump=none."
            exit 1
          fi

      # ── build ──────────────────────────────────────────────────────────────────────────
      - name: Build and test
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
          cargo build --release

      - name: Package
        id: pkg
        env:
          VER: ${{ steps.ver.outputs.new }}
          PRIMARY_BIN: ${{ steps.ver.outputs.primary_bin }}
          BINS: ${{ steps.ver.outputs.bins }}
        run: |
          set -euo pipefail
          mkdir -p dist
          A="dist/${PRIMARY_BIN}-${VER}-x86_64-unknown-linux-gnu.tar.gz"

          # Ship every binary Cargo.toml declares, not just whichever one was true
          # when this step was last hand-edited. Deliberately: the compat binary
          # (currently `gha-runner-ctl`) is kept for one minor cycle so deployed
          # systemd units (gha-runner-ctl@cpu.service) keep working — see the
          # comment on that [[bin]] entry in Cargo.toml. Dropping it from the
          # archive the moment the crate is renamed would break every host on its
          # next reinstall from a release tarball, even though the binary still
          # builds. Ship both; retire the compat entry (and this stops being a
          # multi-binary archive) once the fleet's units are updated.
          for b in $BINS; do
            [ -x "target/release/$b" ] || { echo "::error::expected binary target/release/$b (from Cargo.toml [[bin]]) was not produced by the build"; exit 1; }
          done
          # shellcheck disable=SC2086 -- $BINS is a space-separated list of binary
          # names resolved from Cargo.toml, not a path; word-splitting is intended.
          tar -czf "$A" -C target/release $BINS

          sha256sum "$A" > "dist/SHA256SUMS-${VER}.txt"
          echo "archive=$A" >> "$GITHUB_OUTPUT"
          echo "sums=dist/SHA256SUMS-${VER}.txt" >> "$GITHUB_OUTPUT"

      - name: DRY RUN — stop here
        if: inputs.dry_run
        run: |
          echo "::notice::Dry run. Built and packaged successfully; nothing was tagged, released or published."
          echo '**Dry run — no mutations performed.**' >> "$GITHUB_STEP_SUMMARY"

      # ── mutate: every step check-then-act ──────────────────────────────────────────────
      - name: Commit the version bump
        if: ${{ !inputs.dry_run && inputs.bump != 'none' }}
        env:
          NEW: ${{ steps.ver.outputs.new }}
          CUR: ${{ steps.ver.outputs.current }}
          PKG: ${{ steps.ver.outputs.pkg }}
        run: |
          set -euo pipefail
          [ "$NEW" = "$CUR" ] && { echo "already at $NEW — nothing to bump"; exit 0; }
          sed -i "0,/^version = \"$CUR\"/s//version = \"$NEW\"/" Cargo.toml
          [ -f .cz.toml ] && sed -i "s/^version = \"$CUR\"/version = \"$NEW\"/" .cz.toml || true
          cargo update -p "$PKG" --precise "$NEW" 2>/dev/null || cargo check --quiet
          # Identity is required for a commit AND for an annotated tag. Self-hosted runners
          # have none; hosted ones do not either. Set it locally, never --global.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .cz.toml 2>/dev/null || git add Cargo.toml Cargo.lock
          git commit -m "release: v$NEW"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Tag
        if: ${{ !inputs.dry_run && steps.pre.outputs.tag_exists == 'no' }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          PRIMARY_BIN: ${{ steps.ver.outputs.primary_bin }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$PRIMARY_BIN $TAG"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$TAG"

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          A: ${{ steps.pkg.outputs.archive }}
          S: ${{ steps.pkg.outputs.sums }}
          PRIMARY_BIN: ${{ steps.ver.outputs.primary_bin }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$PRIMARY_BIN $TAG" --generate-notes
          # --clobber makes asset upload idempotent on re-run.
          gh release upload "$TAG" "$A" "$S" --clobber

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run && inputs.publish_crate && steps.pre.outputs.crate_published == 'no' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set — the GitHub release shipped, crates.io was skipped."
            echo '- crates.io: **skipped** (no token)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo publish --no-verify

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          printf -- '\n### Released `%s`\n\nhttps://github.com/%s/releases/tag/%s\n' \
            "$TAG" "${{ github.repository }}" "$TAG" >> "$GITHUB_STEP_SUMMARY"
