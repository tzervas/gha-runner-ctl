[package]
name = "ap_runner_ctl"
version = "0.4.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Podman-backed self-hosted CI runner control plane: registration, dynamic resource pool, on-demand up/down. GitHub Actions today, GitLab next."
repository = "https://github.com/tzervas/gha-runner-ctl"
readme = "README.md"
keywords = ["self-hosted", "podman", "runner", "ci", "github-actions"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[lib]
name = "ap_runner_ctl"
path = "src/lib.rs"

[[bin]]
name = "ap-runner-ctl"
path = "src/main.rs"

# Compat alias for one minor cycle. Deployed systemd units invoke the old path
# (gha-runner-ctl@cpu.service -> ~/.local/bin/gha-runner-ctl), so removing this
# before those units are updated would break every host on restart.
[[bin]]
name = "gha-runner-ctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = true, features = ["json"] }

# Test-only. Deliberately minimal: `ureq` 2.12 is a *blocking* client, and the usual
# mock crates (httpmock 0.8 pulls 245 transitive crates, mockito 113) exist to drive a
# tokio/hyper stack this crate never links. `tiny_http` is a synchronous, real HTTP/1.1
# server in 4 transitive crates (ascii, chunked_transfer, httpdate, log), so the HTTP
# seam tests go over a real socket with real request/response framing rather than an
# in-process shim. For a crate that until now had no dev-dependencies at all and
# forbids unsafe, that is the right supply-chain trade.
[dev-dependencies]
proptest = "1.11.0"
tiny_http = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Stout release binary for host install and the micro-agent image.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
